name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://ai-mock-backend-2y89.onrender.com/api/health
